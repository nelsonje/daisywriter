[project]
name = "daisywriter"
version = "0.1.6"
description = "Mail merge from Word and Excel onto daisywheel typewriters"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jacob Nelson", email = "jacob@jfet.net" }
]
requires-python = ">=3.12"
dependencies = [
    "libusb-package>=1.0 ; sys_platform == 'darwin'",
    "openpyxl>=3.1.5",
    "pyside6-essentials>=6.8",
    "python-docx>=1.2.0",
    "pyusb>=1.2 ; sys_platform != 'win32'",
]

[project.scripts]
daisywriter = "daisywriter:main"

[project.gui-scripts]
daisywriter-gui = "daisywriter.gui:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.4",
    {include-group = "website"},
]
website = [
    "markdown>=3.7",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["hardware: needs a typewriter connected (run with --hardware)"]
