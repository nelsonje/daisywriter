# Swintec 1146 CMP (Nakajima), firmware 335-U, built-in parallel port.
# Character map from FIRMWARE_NOTES.md in the olympia-compact-electronic-2
# repository ("Swintec 1146 CMP firmware 335-U"), where a glyph printout from
# the host confirmed it. The Swintec 1146 CM with firmware 3Z28 maps several of
# these bytes differently: see swintec-1146cm-3z28.toml.
name = "Swintec 1146 CMP"
transport = "usb_printer"
paper = "single_sheet"
# Loading a sheet: insert it until the rollers above the printing point catch it.
# The printing point is then this many lines below the top edge (measured
# 2026-11-08: the first line printed 2 lines lower than the 6-line top margin).
load_offset_lines = 4
# After the bottom edge reaches the printing point, feed this much more so the
# sheet clears those rollers (3 left just the edge held, 2026-11-10).
eject_extra_lines = 5
# The sheet's left edge goes against the paper guide, set at this mark on the
# paper scale, for a 1-inch left margin (the carrier starts at 20 on the scale). The prompts
# mention the mark because the guide is broken on some machines (2026-11-22).
paper_guide = 10
# Backspaces after CR move left of the left margin, down to column 0 (the
# sheet's edge), so a left margin under 1 inch needs no move of the sheet.
# `testpage left` on the Olympia, 2026-11-22; the Swintec firmware has the same code.
left_of_margin = true

pitch_cpi = 10
lines_per_inch = 6
margins = { left = 10, right = 75 }
# Measured 2026-11-08 with `daisywriter testpage margins`: 66 characters fit at
# 10/75 and the 67th wraps, so no safety column is needed.
right_guard = 0

newline = "\n"
# Re-striking in place barely darkens carbon film. A re-strike typed right to
# left lands slightly to the side (play in the carrier drive), which reads as
# bold. Measured 2026-11-10 with `testpage bold`: ["right"] is clearly bolder
# than 2 or 3 strikes from the left; ["left", "right"] is only slightly bolder.
bold = "overstrike"
bold_restrikes = ["right"]
underline = "overprint"
strikethrough = "-"            # overtyped on struck-out text
line_pause_s = 0.0

# ASCII bytes that print a different glyph on this wheel, so the ASCII
# character itself can't be typed. < > | print as themselves.
unavailable = "^~`\\{}"

# Unicode character -> bytes sent. SO (\u000E) ... SI (\u000F) selects the extra petals.
[charset]
"•" = "^"
"²" = "~"
"³" = "`"
"¢" = "\\"
"¼" = "{"
"½" = "}"
"£" = "\u000E*\u000F"
"¶" = "\u000E+\u000F"
"§" = "\u000E,\u000F"
"®" = "\u000E-\u000F"
"±" = "\u000E.\u000F"
"°" = "\u000E/\u000F"
