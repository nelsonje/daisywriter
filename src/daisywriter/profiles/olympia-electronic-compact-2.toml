# Olympia Electronic Compact 2 (firmware 356-U) with Olympia's US printwheel,
# built-in parallel port. Character map from FIRMWARE_NOTES.md in the
# olympia-compact-electronic-2 repository. Checked on paper 2026-11-22 with
# `testpage charset`, on an Olympia fitted with a Swintec wheel: every character
# matched except ©, which is • on that wheel (see
# olympia-electronic-compact-2-swintec-wheel.toml).
name = "Olympia Electronic Compact 2 (Olympia wheel)"
transport = "usb_printer"
usb = { vid = 0x067B, pid = 0x2305 }
paper = "single_sheet"        # or "continuous"
# Loading a sheet: insert it until the rollers above the printing point catch it.
# The printing point is then this many lines below the top edge (measured on
# the Swintec, which shares the mechanism; the Olympia's first line also landed
# 1 inch down, 2026-11-22).
load_offset_lines = 4
# After the bottom edge reaches the printing point, feed this much more so the
# sheet clears those rollers (enough on the Olympia too, 2026-11-22).
eject_extra_lines = 5

pitch_cpi = 10                # slide switch, or ESC P / E / M = 10 / 12 / 15
lines_per_inch = 6            # slide switch, or ESC 6 / 4 / 3
# Margins are set on the keyboard (no escape codes). Power-on defaults are 10 and
# 75, but the firmware wraps a character that lands on the right margin, so the
# last column typed without a wrap is 74: `testpage margins` on the Olympia
# (2026-11-22) fitted 65 characters and wrapped the 66th. (The Swintec's
# power-on margins are one column wider at 10 cpi, so it fits 66.)
margins = { left = 10, right = 74 }
right_guard = 0

# Phase 2 (output), recorded here so profiles stay complete.
newline = "\n"                # LF also returns to the left margin on this firmware
# Measured 2026-11-22 with `testpage bold`: a re-strike typed right to left is
# clearly bolder than strikes from the left and still one clean mark; more
# strikes add little. The same as on both Swintecs.
bold = "overstrike"
bold_restrikes = ["right"]
underline = "overprint"
strikethrough = "-"            # overtyped on struck-out text
line_pause_s = 0.0

# ASCII bytes that print a different glyph on this wheel, so the ASCII
# character itself can't be typed.
unavailable = "<>^\\`{|}~"

# Unicode character -> bytes sent. SO (\u000E) ... SI (\u000F) selects the extra petals.
[charset]
"±" = "<"
"°" = ">"
"¢" = "^"
"§" = "\\"
"¶" = "`"
"½" = "{"
"¼" = "|"
"²" = "}"
"³" = "~"
"|" = "\u000E,\u000F"
"©" = "\u000E-\u000F"
"£" = "\u000E.\u000F"
"®" = "\u000E/\u000F"
