name: Website

# Builds the web page (website/) for a release and publishes it with GitHub Pages:
# after CI has published a release from a v<version> tag, or by hand (Actions >
# Website > Run workflow). It deploys only when the repository variable PAGES is
# "true" (Settings > Secrets and variables > Actions > Variables), set once Pages
# is turned on (Settings > Pages > Source: GitHub Actions).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to link to, e.g. v0.1.2 (default: the newest)"
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the release's tag, for its user guide
      - name: Which release
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -eu
          tag="${WANTED:-$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')}"
          gh release view "$tag" --json tagName --jq '"linking to release " + .tagName'
          git show "$tag:src/daisywriter/gui/user_guide.md" > "$RUNNER_TEMP/user_guide.md"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked --no-dev --group website python website/build.py --version "$TAG" --out _site --guide "$RUNNER_TEMP/user_guide.md"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: vars.PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
