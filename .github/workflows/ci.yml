name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run daisywriter make-samples samples
          uv run daisywriter validate samples/letter-template.docx samples/letter-data.xlsx
          uv run daisywriter preview samples/letter-template.docx samples/letter-data.xlsx --letters 1 > preview.txt
          uv run daisywriter print samples/letter-template.docx samples/letter-data.xlsx --letters 1 -y --emulate letter.pdf
