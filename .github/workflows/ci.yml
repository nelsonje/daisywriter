name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Qt libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run pytest
      - name: CLI smoke test
        run: |
          uv run daisywriter make-samples samples
          uv run daisywriter validate samples/letter-template.docx samples/letter-data.xlsx
          uv run daisywriter preview samples/letter-template.docx samples/letter-data.xlsx --letters 1 > preview.txt
          uv run daisywriter print samples/letter-template.docx samples/letter-data.xlsx --letters 1 -y --emulate letter.pdf

  installer:
    # The Windows installer: freeze with PyInstaller, pack with WiX, then install it
    # silently, run both programs, and uninstall it again.
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group packaging
      - name: Freeze (PyInstaller)
        run: uv run --group packaging pyinstaller packaging/daisywriter.spec --noconfirm
      - name: Build the MSI (WiX)
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = (uv version --short).Trim()
          $app = (Resolve-Path dist/daisywriter).Path  # WiX resolves a relative bindpath oddly
          # -wx: warnings are errors (a missing folder is only a warning, and gives an empty MSI)
          $pkg = (Resolve-Path packaging).Path  # where WiX finds daisywriter.ico
          wix build packaging/daisywriter.wxs -arch x64 -wx -bindpath "app=$app" -bindpath $pkg `
            -d Version=$version -o "dist/daisywriter-$version-x64.msi"
          if ($LASTEXITCODE) { exit 1 }
          $size = (Get-Item "dist/daisywriter-$version-x64.msi").Length
          "MSI size: $([math]::Round($size / 1MB, 1)) MB"
          if ($size -lt 10MB) { throw "the MSI is too small to hold the program" }
          "MSI=dist/daisywriter-$version-x64.msi" >> $env:GITHUB_ENV
      - name: Install, run and uninstall
        run: |
          function Check($what) { if ($LASTEXITCODE) { throw "$what failed ($LASTEXITCODE)" } }
          $msi = (Resolve-Path $env:MSI).Path
          function Msi($arguments) {
            # Start-Process -Wait can lose msiexec's exit code; read it from the process instead
            $p = Start-Process msiexec.exe -ArgumentList $arguments -PassThru
            $p.WaitForExit()
            return $p.ExitCode
          }
          $code = Msi "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\install.log`""
          "msiexec /i exit code: $code"
          if ($code -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "install failed ($code)" }
          $dir = Join-Path $env:ProgramFiles "daisywriter"
          $cli = Join-Path $dir "daisywriter-cli.exe"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -First 10 | Format-Table Name, Length
          if (-not (Test-Path $cli)) {
            Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} -Filter "daisywriter*" -Recurse -Depth 2 `
              -ErrorAction SilentlyContinue | Select-Object -First 10 FullName
            Select-String -Path "$env:RUNNER_TEMP\install.log" -Pattern "INSTALLFOLDER|daisywriter-cli|Return value 3" |
              Select-Object -First 20 | ForEach-Object Line
            throw "daisywriter-cli.exe isn't in $dir"
          }
          $work = Join-Path $env:RUNNER_TEMP "smoke"
          & $cli profiles; Check "profiles"
          & $cli make-samples $work; Check "make-samples"
          & $cli print "$work/letter-template.docx" "$work/letter-data.xlsx" --letters 1 -y `
            --typing-errors 3 --emulate "$work/letter.pdf"; Check "emulated print"
          if (-not (Test-Path "$work/letter.pdf")) { throw "no PDF" }
          $env:DAISYWRITER_SMOKE_TEST = "2"
          $env:QT_QPA_PLATFORM = "offscreen"
          $g = Start-Process (Join-Path $dir "daisywriter.exe") -Wait -PassThru
          if ($g.ExitCode) { throw "the window exited with $($g.ExitCode)" }
          $shortcut = Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\daisywriter.lnk"
          if (-not (Test-Path $shortcut)) { throw "no Start menu shortcut" }
          $path = [Environment]::GetEnvironmentVariable("PATH", "Machine")
          if (-not $path.Contains($dir)) { throw "not on PATH" }
          $code = Msi "/x `"$msi`" /qn"
          if ($code -ne 0) { throw "uninstall failed ($code)" }
          if (Test-Path $dir) { throw "the install folder is still there" }
          if (Test-Path $shortcut) { throw "the shortcut is still there" }
      - uses: actions/upload-artifact@v7
        with:
          name: daisywriter-msi
          path: dist/*.msi

  macos-app:
    # The Mac app: freeze with PyInstaller into daisywriter.app, pack it in a disk
    # image, then mount the image and run both programs from it. Not signed yet.
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group packaging
      - name: Freeze (PyInstaller)
        run: uv run --group packaging pyinstaller packaging/daisywriter.spec --noconfirm
      - name: Disk image
        run: echo "DMG=$(packaging/make_dmg.sh)" >> "$GITHUB_ENV"
      - name: Run the app from the disk image
        run: |
          set -eux
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$DMG"
          app="$mnt/daisywriter.app/Contents/MacOS"
          work=$(mktemp -d)
          "$app/daisywriter-cli" profiles
          # the bundled libusb loads: no adapter is plugged in, so "not found" (exit 1)
          "$app/daisywriter-cli" status 2>&1 | tee "$work/status.txt" || true
          grep -q "not found" "$work/status.txt"
          "$app/daisywriter-cli" make-samples "$work/s"
          "$app/daisywriter-cli" print "$work/s/letter-template.docx" "$work/s/letter-data.xlsx" \
            --letters 1 -y --typing-errors 3 --emulate "$work/letter.pdf"
          test -s "$work/letter.pdf"
          DAISYWRITER_SMOKE_TEST=2 QT_QPA_PLATFORM=offscreen "$app/daisywriter"
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v7
        with:
          name: daisywriter-dmg
          path: dist/*.dmg
